<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><h1>login form</h1>t</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        
<table>

<tr>
    <td>Username:</td>
    <td><input type="text" id="username" name="username"></td>
</tr>
<tr>
    <td>Password:</td>
    <td><input type="password" id="password" name="password"></td>
</tr>
<tr>
    <td>course</td>
    <td><select name="course" id="course">
        <option value="java">java</option>
        <option value="python">python</option>
        <option value="c++">c++</option>
        <option value="javascript">javascript</option>
</tr>
<tr>
    <td>gender</td>
    <td><input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label></td>
<tr>
    <td>enter age</td>
    <td> <input type="number" placeholder="Age"></td>
</tr>
<tr>
    <td><input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label></td>
<tr>
    <td><button type="submit">Login</button></td>

</table>
        <button><a href="https://www.w3schools.com/js/">Learn JavaScript</a></button>
        </center>
           
</body>

</html>
